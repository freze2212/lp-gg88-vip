function resolveSiteConfig(cfg, domains) {
  const host = window.location.hostname.toLowerCase().replace(/^www\./, '');
  const domainKey = Object.keys(domains || {}).find(k => k.toLowerCase() === host);
  const domainCfg = domainKey ? domains[domainKey] : (domains[host] || {});

    (typeof domainCfg === 'object' && domainCfg.telegram && domainCfg.telegram.url) ||
    (cfg.tele_url || cfg.telegram_url) ||
    (cfg.messenger && cfg.messenger.url) ||
    (cfg.telegram && cfg.telegram.url) ||

  if (typeof messUrl === 'string') {

    if (messUrl.startsWith('@')) {
